packages:
  - contracts
  - sdk
  - examples
  - apps/dashboard
allowBuilds:
  esbuild: true
  keccak: false
  secp256k1: false
  # The shared 0G shell builds its dist (tsdown, Tailwind CLI) on install: its
  # prepare script is the build. 0g-site keys this on the resolved commit, but
  # this workspace's pnpm rejects that key as a version union.
  '@0gfoundation/0g-ui': true
  # WalletConnect's AppKit dependency: the postinstall is non-essential (as in 0g-hub)
  '@reown/appkit': false
  # MetaMask SDK transitive dep: the postinstall only writes CLI aliases (as in 0g-hub)
  protobufjs: false
